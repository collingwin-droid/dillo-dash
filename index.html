<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dillo Dash: Austin</title>
<style>
html,body{margin:0;height:100%;background:#120826;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,sans-serif}
canvas#c{display:block;width:100vw;height:100vh;cursor:pointer}
:root{--pc:#f07a2a}
#pad{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));box-sizing:border-box;color:#fff;
 background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--pc) 45%,#1a0b3d) 0%,#170a3a 60%,#0e0522 100%)}
#padTop{text-align:center}
#padName{font:900 26px "Arial Black",system-ui,sans-serif;letter-spacing:.5px;color:var(--pc);text-shadow:0 2px 0 #2b0f4a}
#padDillo{width:160px;height:80px;display:block;margin:6px auto 0}
#padStatus{font-size:17px;line-height:1.35;max-width:22em;margin:10px auto 0;min-height:2.7em}
#padBtn{width:min(78vw,62vh,360px);aspect-ratio:1;border-radius:50%;border:none;background:var(--pc);color:#1a0f30;font:900 clamp(34px,11vw,56px) "Arial Black",system-ui,sans-serif;
 box-shadow:0 12px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 60px color-mix(in srgb,var(--pc) 50%,transparent);transition:transform .05s,box-shadow .05s;touch-action:none}
#padBtn.down{transform:translateY(10px);box-shadow:0 2px 0 color-mix(in srgb,var(--pc) 55%,#000),0 0 30px color-mix(in srgb,var(--pc) 50%,transparent)}
#padBtn.ready{background:#7cf2e6}
#padBtn:disabled{opacity:.35}
#padSub{font-size:13px;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad">
  <div id="padTop"><div id="padName"></div><canvas id="padDillo"></canvas><div id="padStatus"></div></div>
  <button id="padBtn">JUMP</button>
  <div id="padSub"></div>
</div>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();

    ai: { idx: 0, plan: -1, trig: 0, hold: .1, jumped: false, stuck: 0, mistake: .1 + i * .035 }
  };
}

let state = 'lobby', t = 0, raceT = 0, countdown = 0, runners = [], cam = 0, resultsT = 0, postT = 0, firstHumanFinishT = -1;
let finishOrder = [], results = [], goFlash = 0, toast = null, announced = new Set(), best = null, solo = true, round = 1;

function startRace() {
  const joined = slots.map(s => !!s);
  solo = !joined.some(Boolean);
  buildTrack(Math.random() * 1e9 | 0);
  runners = CHARS.map((d, i) => makeRunner(d, i, solo ? i === 0 : joined[i], solo));
  state = 'countdown'; countdown = 3; raceT = 0; postT = 0; firstHumanFinishT = -1; finishOrder = []; results = [];
  cam = 0; announced = new Set(); toast = null; round++;
  sfx('beep');
  pushHost(true);
}
buildTrack(2026);

/* ---------------- Physics ---------------- */
const inPit = cx => pits.find(p => cx > p.x + 4 && cx < p.x + p.w - 4);
const overlap = (a, b, s = 0) => a.x + s < b.x + b.w && a.x + a.w - s > b.x && a.y + s < b.y + b.h && a.y + a.h - s > b.y;
function safeX(x) {
  for (let k = 0; k < 6; k++) {
    const p = pits.find(p => x + 50 > p.x - 10 && x < p.x + p.w + 10);
    if (p) { x = p.x + p.w + 20; continue; }
    const tr = trucks.find(tr => x + 45 > tr.x && x < tr.x + tr.w);
    if (tr) { x = tr.x + tr.w + 20; continue; }
    break;
  }
  return x;
}

function aiJump(r, hold) { r.buf = .1; r.held = true; r.holdT = hold; }
function ai(r, dt) {
  const A = r.ai;
  if (r.holdT > 0) { r.holdT -= dt; if (r.holdT <= 0) r.held = false; }
  while (A.idx < obstacles.length && obstacles[A.idx].x + obstacles[A.idx].w < r.x) A.idx++;
  const o = obstacles[A.idx]; if (!o) return;
  if (A.plan !== A.idx) {
    A.plan = A.idx; A.jumped = false; A.stuck = 0;
    const kind = o.type === 'scooter' ? (o.fallen ? 'fallen' : 'upright') : o.type;
    A.trig = { cone: 55, fallen: 62, upright: 72, pit: 28, truck: 85 }[kind] + Math.random() * 30;
    A.hold = { cone: .06, fallen: .1, upright: .16, pit: .3, truck: .18 }[kind] + Math.random() * .1;
    if (Math.random() < A.mistake) A.trig = Math.random() < .5 ? A.trig + 170 : -30;
  }
  const dist = o.x - (r.x + r.w);
  if (!A.jumped && r.grounded && dist <= A.trig * (r.boost > 0 ? 1.5 : 1)) { aiJump(r, A.hold); A.jumped = true; }
  if (o.type === 'truck' && r.grounded && dist < 2 && r.y + r.h > o.y + 5) {
    A.stuck += dt; if (A.stuck > .3) { aiJump(r, .25); A.stuck = 0; }
  }
}

function focusRunner() {
  const hs = runners.filter(r => r.human);
  if (!hs.length) return runners[0];
  return hs.reduce((a, b) => (b.x > a.x ? b : a));
}

function updateRunner(r, dt, focus) {
  r.anim += dt;
  if (r.respawn > 0) { r.respawn -= dt; return; }
  if (r.blink > 0) r.blink -= dt;
  if (r.stumble > 0) r.stumble -= dt;
  if (r.boost > 0) r.boost -= dt;
  let spd = r.base * (r.boost > 0 ? 1.5 : 1) * (r.stumble > 0 ? .35 : 1);
  if (!r.human && !r.finished) {
    const d = r.x - focus.x;
    if (d > 500) spd *= .94; else if (d < -500) spd *= 1.07;
    ai(r, dt);
  }
  if (r.finished) { r.fspd = Math.max(0, (r.fspd ?? spd) - 350 * dt); spd = r.fspd; }

  r.coyote = r.grounded ? .09 : r.coyote - dt;
  r.buf -= dt;
  if (r.buf > 0 && r.coyote > 0 && !r.finished) {
    r.vy = -JUMP; r.grounded = false; r.coyote = 0; r.buf = 0;
    if (r.human) sfx('jump');
  }
  let nx = r.x + spd * dt;
  for (const k of trucks) {
    if (r.y + r.h > k.y + 3 && r.y < k.y + k.h && r.x + r.w <= k.x + 1 && nx + r.w > k.x) nx = k.x - r.w;
  }
  if (r.y + r.h > GROUND + 4) {
    const p = pits.find(p => r.x + r.w / 2 > p.x - 12 && r.x + r.w / 2 < p.x + p.w + 12);
    if (p) nx = Math.max(p.x, Math.min(nx, p.x + p.w - r.w));
  }
  r.x = nx;
  const g = GRAV * ((r.held && r.vy < 0) ? .5 : 1);
  r.vy = Math.min(r.vy + g * dt, 1500);
  let ny = r.y + r.vy * dt;
  r.grounded = false;
  if (r.vy >= 0) {
    for (const k of trucks) {
      if (r.x + r.w > k.x + 4 && r.x < k.x + k.w - 4 && r.y + r.h <= k.y + 2 && ny + r.h >= k.y) {
        ny = k.y - r.h; r.vy = 0; r.grounded = true; break;
      }
    }
    if (!r.grounded && r.y + r.h <= GROUND + 2 && ny + r.h >= GROUND && !inPit(r.x + r.w / 2)) {
      ny = GROUND - r.h; r.vy = 0; r.grounded = true;
    }
  }
  r.y = ny;
  if (r.y > GROUND + 150) {
    const p = pits.find(p => r.x + r.w > p.x - 10 && r.x < p.x + p.w + 10);
    if (p) r.x = p.x - 95;
    r.y = GROUND - r.h; r.vy = 0; r.respawn = .8; r.blink = 1.5; r.grounded = true; r.stumble = 0;
    r.ai.plan = -1; r.held = false;
    if (r.human) sfx('fall');
    return;
  }
  if (r.blink <= 0) {
    for (let i = 0; i < hazards.length; i++) {
      const hz = hazards[i];
      if (!r.hit.has(i) && overlap(r, hz, 5)) {
        r.hit.add(i); r.stumble = .75; hz.wob = 1;
        if (r.grounded) { r.vy = -220; r.grounded = false; }
        if (r.human) sfx('hit');
      }
    }
  }
  for (let i = 0; i < tacos.length; i++) {
    const tc = tacos[i];
    if (!r.taken.has(i) && overlap(r, { x: tc.x, y: tc.y + Math.sin(t * 3 + tc.ph) * 5, w: tc.w, h: tc.h }, -4)) {
      r.taken.add(i); r.boost = 1.8; r.stumble = 0;
      if (r.human) sfx('taco');
    }
  }
  if (!r.finished && r.x + r.w >= TRACK) {
    r.finished = true; r.ft = raceT; finishOrder.push(r);
    if (r.human) sfx('win');
  }
}

function placeOf(r) {
  let ahead = 0;
  for (const o of runners) {
    if (o === r) continue;
    if (o.finished && (!r.finished || o.ft < r.ft)) ahead++;
    else if (!o.finished && !r.finished && o.x > r.x) ahead++;
  }
  return ahead;
}
const ORD = ['1st', '2nd', '3rd', '4th'];

function update(dt) {
  if (goFlash > 0) goFlash -= dt;
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (state === 'lobby') { cam += 70 * dt; if (cam > TRACK - VW) cam = 0; return; }
  if (state === 'countdown') {
    const prev = Math.ceil(countdown);
    countdown -= dt;
    if (countdown > 0 && Math.ceil(countdown) !== prev) sfx('beep');
    if (countdown <= 0) { state = 'race'; goFlash = .9; sfx('go'); pushHost(true); }
    return;
  }
  if (state === 'race') raceT += dt; else resultsT += dt;
  const focus = focusRunner();
  for (const r of runners) updateRunner(r, dt, focus);
  const humans = runners.filter(r => r.human);
  const lead = humans.length > 1 ? .55 : .3;
  const target = Math.max(0, focus.x - VW * lead);
  cam += (target - cam) * Math.min(1, dt * 7);
  // keep every human racer on screen: stragglers get carried forward (Fun Run style)
  if (state === 'race' && humans.length > 1) {
    for (const h of humans) {
      if (!h.finished && h.respawn <= 0 && h.x + h.w < cam + 4 && cam > 50) {
        h.x = safeX(cam + 70); h.y = GROUND - h.h; h.vy = 0; h.blink = 1.2; h.stumble = .4; h.ai.plan = -1;
      }
    }
  }
  for (const l of landmarks) {
    const sx = l.x - cam * MID_F;
    if (!announced.has(l.name) && sx < VW * .62) { announced.add(l.name); toast = { text: l.name, t: 2.6 }; }
  }
  for (const n of nearProps) {
    if (!n.name) continue;
    if (!announced.has(n.name) && n.x - cam < VW * .62) { announced.add(n.name); toast = { text: n.name, t: 2.6 }; }
  }
  if (state === 'race') {
    const humansDone = humans.length && humans.every(h => h.finished);
    if (humans.some(h => h.finished) && firstHumanFinishT < 0) firstHumanFinishT = raceT;
    if (humansDone) postT += dt;
    const allDone = finishOrder.length === runners.length;
    if (allDone || postT > 4 || (firstHumanFinishT >= 0 && raceT - firstHumanFinishT > 15)) {
      results = [...finishOrder, ...runners.filter(r => !r.finished).sort((a, b) => b.x - a.x)];
      state = 'results'; resultsT = 0;
      if (solo && runners[0].finished && (best === null || runners[0].ft < best)) best = runners[0].ft;
      pushHost(true);
    }
  }
}

/* ---------------- Drawing helpers ---------------- */
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function windows(x, y, w, h, cols, rows, col, p, seed) {
  const R = rng(seed), cw = w / cols, rh = h / rows;
  c.fillStyle = col;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) if (R() < p) c.fillRect(x + i * cw + cw * .25, y + j * rh + rh * .28, cw * .5, rh * .44);
}
function glow(x, y, r, col) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
}
function txt(s, x, y, size, col, align = 'center', font = FONT) {
  c.font = `${size}px ${font}`; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y);
}
function fitTxt(s, x, y, maxW, size, col) {
  c.font = `${size}px ${FONT}`;
  const w = c.measureText(s).width;
  if (w > maxW) size = size * maxW / w;
  txt(s, x, y, size, col);
}
function poly(pts, fill) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } }
function line(x1, y1, x2, y2, col, w) { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
// shade the right-hand side of whatever is drawn by fn (gives buildings a lit face and a shadow face)
function shadeRight(x0, fn, col = 'rgba(10,0,40,.28)') { c.save(); c.beginPath(); c.rect(x0, -2000, 2000, 2000); c.clip(); c.globalCompositeOperation = 'source-over'; fn(col); c.restore(); }
function bat(x, y, s, f) {
  const fl = Math.sin(f) * 4 * s;
  c.beginPath(); c.moveTo(x, y);
  c.quadraticCurveTo(x - 5 * s, y - 4 * s - fl, x - 10 * s, y - fl);
  c.quadraticCurveTo(x - 5 * s, y - 1 * s, x, y + 2 * s);
  c.quadraticCurveTo(x + 5 * s, y - 1 * s, x + 10 * s, y - fl);
  c.quadraticCurveTo(x + 5 * s, y - 4 * s - fl, x, y);
  c.fill();
}
function hLines(x, y, w, h, step, col, lw = 1) { c.fillStyle = col; for (let yy = y; yy < y + h; yy += step) c.fillRect(x, yy, w, lw); }
function vLines(x, y, w, h, step, col, lw = 1) { c.fillStyle = col; for (let xx = x; xx < x + w; xx += step) c.fillRect(xx, y, lw, h); }

      txt(solo ? 'PRESS SPACE OR TAP TO RACE AGAIN' : 'Tap READY on your phones for a rematch  ·  SPACE = back to lobby (new players)', cx, 375, solo ? 18 : 14, '#fff');
      c.globalAlpha = 1;
    }
    if (solo && best !== null) txt(`Best time: ${best.toFixed(2)}s`, cx, 405, 14, '#7cf2e6');
  }
}

/* ---------------- Phone controllers (WebSocket game server) ---------------- */
const slots = [false, false, false, false];   // which armadillos have a phone connected
const padState = [{}, {}, {}, {}];
const padN = [0, 0, 0, 0];
let ws = null, code = '', base = location.origin, roomStatus = 'connecting', qrCanvases = [], lastHostJSON = '', lastPushT = 0;

const wsURL = () => (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
function padURL(slot) { return `${base}/?join=${code}-${slot + 1}`; }
function buildQRs() {
  qrCanvases = [];
  if (typeof qrcode !== 'function' || !code) return;
  for (let i = 0; i < 4; i++) {
    const q = qrcode(0, 'M'); q.addData(padURL(i)); q.make();
    const n = q.getModuleCount(), m = 4, pad = 2, oc = document.createElement('canvas');
    oc.width = oc.height = (n + pad * 2) * m;
    const o = oc.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, oc.width, oc.height); o.fillStyle = '#111';
    for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) o.fillRect((cc + pad) * m, (r + pad) * m, m, m);
    qrCanvases.push(oc);
  }
}
function padReady(i) { return slots[i] && padState[i].readyFor === round; }

function onPadJoin(i) {
  slots[i] = true; padN[i] = 0; padState[i] = {}; sfx('join');
  const r = runners[i];
  if (r && !solo && state !== 'lobby') { r.human = true; r.base = 330; r.tag = `P${i + 1} ${r.name}`; }
}
function onPadLeave(i) {
  slots[i] = false; padState[i] = {};
  const r = runners[i];
  if (r && !solo && state !== 'lobby') { r.human = false; r.held = false; r.tag = `${r.name} · CPU`; r.ai.plan = -1; }
}
function onPadInput(i, m) {
  padState[i] = { n: m.n, held: m.held, readyFor: m.readyFor };
  const r = runners[i];
  const live = r && r.human && (state === 'race' || state === 'countdown');
  if (m.n > padN[i]) { padN[i] = m.n; if (live) r.buf = .14; }
  if (live) r.held = !!m.held;
}
function readPads() {
  if (state === 'lobby' || (state === 'results' && resultsT > 1.5)) {
    const joined = [0, 1, 2, 3].filter(i => slots[i]);
    if (joined.length && joined.every(padReady)) startRace();
  }
}
function pushHost(force) {
  if (!ws || ws.readyState !== 1) return;
  const now = performance.now();
  if (!force && now - lastPushT < 150) return;
  const places = runners.length && state !== 'lobby' ? runners.map(r => placeOf(r) + 1) : [0, 0, 0, 0];
  const msg = { t: 'state', st: state, round, places };
  const j = JSON.stringify(msg);
  if (j === lastHostJSON && !force) return;
  lastHostJSON = j; lastPushT = now;
  ws.send(j);
}
function initHost() {
  if (!/^https?:$/.test(location.protocol)) { roomStatus = 'off'; return; }
  let opened = false;
  try { ws = new WebSocket(wsURL()); } catch (e) { roomStatus = 'off'; return; }
  ws.onopen = () => { opened = true; ws.send(JSON.stringify({ t: 'host', code: code || undefined })); };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.t === 'room') {
      if (m.code !== code || m.base !== base) { code = m.code; base = m.base || location.origin; buildQRs(); }
      roomStatus = 'ok'; pushHost(true);
    } else if (m.t === 'pad') {
      const i = (m.slot | 0) - 1; if (i < 0 || i > 3) return;
      m.on ? onPadJoin(i) : onPadLeave(i); pushHost(true);
    } else if (m.t === 'in') {
      const i = (m.slot | 0) - 1; if (i >= 0 && i < 4 && slots[i]) onPadInput(i, m);
    }
  };
  ws.onclose = () => {
    ws = null;
    if (!opened && !code) { roomStatus = 'off'; return; }
    roomStatus = 'connecting';
    setTimeout(initHost, 1500);
  };
}

/* ---------------- Phone pad page ---------------- */
function runPad(code_, slot) {
  hostRunning = false;
  const ch = CHARS[slot - 1];
  const el = id => document.getElementById(id);
  cv.style.display = 'none';
  el('pad').style.display = 'flex';
  document.documentElement.style.setProperty('--pc', ch.color);
  el('padName').textContent = `P${slot} · ${ch.name}`;
  drawPadDillo(el('padDillo'), ch.color);
  const status = s => { el('padStatus').textContent = s; };
  const btn = el('padBtn'), sub = el('padSub');
  let id = '';
  try { id = sessionStorage.getItem('dilloPadId') || ''; } catch (_) {}
  if (!id) { id = Math.random().toString(36).slice(2, 12); try { sessionStorage.setItem('dilloPadId', id); } catch (_) {} }
  let sock = null, n = 0, held = false, readyFor = -1, hs = null, joined = false, ended = '', hostGone = false;
  const send = () => { if (sock && sock.readyState === 1 && joined) sock.send(JSON.stringify({ t: 'in', n, held, readyFor })); };
  const render = () => {
    if (ended) { status(ended); btn.disabled = true; btn.textContent = '—'; sub.textContent = ''; return; }
    if (!joined) { status('Connecting to the game…'); btn.disabled = true; return; }
    if (hostGone || !hs) { status(hostGone ? 'Waiting for the big screen to come back…' : "You're in! Waiting for the big screen…"); btn.disabled = false; btn.textContent = 'READY'; return; }
    btn.disabled = false;
    const place = hs.places && hs.places[slot - 1];
    if (hs.st === 'lobby' || hs.st === 'results') {
      const isReady = readyFor === hs.round;
      btn.textContent = isReady ? 'READY ✓' : 'READY';
      btn.classList.toggle('ready', isReady);
      if (hs.st === 'results') status(place ? `You finished ${ORD[place - 1]}! ${isReady ? 'Waiting for the others…' : 'Tap READY for a rematch.'}` : 'Race over!');
      else status(isReady ? "You're ready! Waiting for the other racers…" : "You're in! Tap READY when you're set.");
      sub.textContent = 'Watch the big screen';
    } else {
      btn.classList.remove('ready');
      btn.textContent = 'JUMP';
      status(hs.st === 'countdown' ? 'Get set… tap to jump, hold to jump higher' : (place ? `Racing — you're ${ORD[place - 1]}` : 'GO!'));
      sub.textContent = 'Tap = hop · Hold = big jump';
    }
  };
  function connect() {
    try { sock = new WebSocket(wsURL()); } catch (e) { ended = "Couldn't reach the game. Check your connection and scan again."; render(); return; }
    sock.onopen = () => sock.send(JSON.stringify({ t: 'join', code: code_, slot, id }));
    sock.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.t === 'joined') { joined = true; n = 0; held = false; hostGone = false; }
      else if (m.t === 'taken') ended = 'Someone already grabbed this armadillo. Scan a different code on the big screen.';
      else if (m.t === 'noroom') ended = "This game isn't running anymore. Scan the code on the big screen again.";
      else if (m.t === 'state') { hs = m; hostGone = false; }
      else if (m.t === 'hostgone') hostGone = true;
      render();
    };
    sock.onclose = () => { joined = false; if (!ended) { render(); setTimeout(connect, 1000); } };
  }
  const down = e => {
    e.preventDefault();
    if (btn.disabled) return;
    n++; held = true;
    if (hs && (hs.st === 'lobby' || hs.st === 'results')) readyFor = hs.round;
    send(); btn.classList.add('down');
    try { navigator.vibrate && navigator.vibrate(15); } catch (_) {}
    render();
  };
  const up = () => { if (!held) return; held = false; send(); btn.classList.remove('down'); };
  btn.addEventListener('pointerdown', down);
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (!sock || sock.readyState > 1) && !ended) connect(); });
  render(); connect();
}
function drawPadDillo(canvas, color) {
  const pc = canvas.getContext('2d'), k = 6;
  canvas.width = 80 * k; canvas.height = 40 * k;
  const old = c; c = pc;
  pc.scale(k, k); dilloBody(40, 36, color, { anim: 0 });
  c = old;
}

/* ---------------- Input (host screen) ---------------- */
function press() {
  if (state === 'lobby') { startRace(); return; }
  if (state === 'results') { if (resultsT > 1) { if (solo) startRace(); else { state = 'lobby'; pushHost(true); } } return; }
  if (solo) { const P = runners[0]; P.buf = .13; P.held = true; }
}
function release() { if (solo && runners[0]) runners[0].held = false; }
const JUMP_KEYS = [' ', 'Spacebar', 'ArrowUp', 'w', 'W', 'Enter'];

/* ---------------- Boot ---------------- */
let hostRunning = true;
function bootHost() {
  addEventListener('keydown', e => {
    if (!hostRunning) return;
    if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
    if (JUMP_KEYS.includes(e.key)) { e.preventDefault(); if (!e.repeat) press(); }
  });
  addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.key)) release(); });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('blur', release);
  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  function frame(now) {
    if (!hostRunning) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; acc += dt;
    readPads();
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    pushHost(false);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  initHost();
}
function route() {
  const q = new URLSearchParams(location.search).get('join') || (location.hash || '').replace(/^#join-/, '');
  const m = /^([a-z0-9]{4,8})-([1-4])$/.exec(q || '');
  if (m) { runPad(m[1], +m[2]); return true; }
  return false;
}
if (!route()) bootHost();

window.__game = {
  get state() { return state; }, get runners() { return runners; }, get obstacles() { return obstacles; },
  get cam() { return cam; }, set cam(v) { cam = v; }, get slots() { return slots; }, get code() { return code; }, get base() { return base; }, padURL,
  get roomStatus() { return roomStatus; }, press, release, startRace
};
